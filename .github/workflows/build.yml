name: Build and Release Sanctuary

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller vosk

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Eradicate Buggy node-gyp (Ultimate Fix)
        run: |
          npm.cmd install -g node-gyp@latest
          $NpmDir = Split-Path (Get-Command npm.cmd).Source
          $BuggyGyp = "$NpmDir\node_modules\npm\node_modules\node-gyp"
          $GlobalModules = npm.cmd root -g
          $GoodGyp = "$GlobalModules\node-gyp"
          Remove-Item -Recurse -Force $BuggyGyp
          Copy-Item -Recurse $GoodGyp $BuggyGyp
        shell: powershell

      - name: Install Dependencies
        run: npm.cmd install

      - name: Disable Windows Defender scanning (Prevents EBUSY locks on exe)
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
        shell: powershell

      - name: Build Python AI Bridge
        run: npm.cmd run build:ai

      - name: Build Application (TypeScript)
        run: npm.cmd run build

      - name: Wait for Antivirus to release locks
        run: Start-Sleep -Seconds 15
        shell: powershell

      - name: Package Electron App (Windows)
        run: npx.cmd electron-builder --win -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_MSVS_VERSION: 2022

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Windows-Build
          path: |
            release/*.exe
            release/*.zip

