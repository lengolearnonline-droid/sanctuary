name: Build and Release Sanctuary

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # NDI 'grandiose' relies on native C++ compilation (node-gyp)
      # windows-latest comes with Visual Studio Build Tools pre-installed.
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller vosk

      - name: Install Dependencies
        run: npm install

      - name: Disable Windows Defender scanning (Prevents EBUSY locks on exe)
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
        shell: powershell

      - name: Build Python AI Bridge
        run: npm run build:ai

      - name: Build Application (TypeScript)
        run: npm run build

      - name: Wait for Antivirus to release locks
        run: Start-Sleep -Seconds 15
        shell: powershell

      - name: Package Electron App (Windows)
        run: npx electron-builder --win -p always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanctuary-Windows-Build
          path: |
            release/*.exe
            release/*.zip






